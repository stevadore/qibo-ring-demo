<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#edf8f6" />
  <title>海河岐伯 App 原型</title>
  <style>
    :root{
      --bg:#eef8f6;--card:#fff;--text:#18243a;--muted:#8b98a8;--line:#e7efef;
      --mint:#52d5cc;--mint-soft:#ddfaf6;--purple:#7763ed;--blue:#4f92f6;
      --lav:#f2efff;--orange:#f5a043;--danger:#df4d59;--shadow:0 5px 18px rgba(42,80,102,.08)
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:#dfe9eb;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text)}
    button,input{font:inherit}
    button{color:inherit}
    .shell{width:min(100vw,472px);height:100dvh;margin:auto;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 0 36px rgba(20,45,61,.18)}
    .status{height:24px;background:#fff8ff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#9aa6b0;font-size:11px}
    .status-dots{display:flex;gap:4px}.status-dots i{width:6px;height:6px;border-radius:2px;background:#4fd6c8}.status-dots i:nth-child(2){background:#ff706c}.status-dots i:nth-child(3){background:#f3b64e}.status-dots i:nth-child(4){background:#5a95eb}
    .screen{height:calc(100dvh - 24px);overflow:auto;padding:12px 10px 96px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}
    .screen.detail{padding-bottom:24px}
    h1,h2,h3,p{margin:0}.page-title{font-size:18px;font-weight:750;letter-spacing:.02em;margin:2px 0 14px}.greeting{font-size:23px;line-height:1.15;font-weight:760}.date{font-size:12px;color:var(--muted);margin-top:3px}
    .topline{display:flex;align-items:center;gap:10px;margin:0 0 14px}.back{border:0;background:transparent;font-size:26px;line-height:1;padding:0 4px 2px 0;cursor:pointer}.topline h1{font-size:18px}.top-spacer{margin-left:auto;color:#78909a}
    .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px;padding:16px;border:1px solid rgba(215,230,232,.55)}
    .card.clickable{cursor:pointer;transition:.16s transform,.16s box-shadow}.card.clickable:active{transform:scale(.985);box-shadow:0 2px 8px rgba(42,80,102,.08)}
    .schedule{border:1.5px solid #8fb9e8;background:rgba(255,255,255,.34);box-shadow:none;min-height:150px;position:relative}.schedule .doctor{position:absolute;right:16px;top:18px;font-size:44px}.schedule strong{font-size:16px}.tag{display:inline-block;background:#e7e4fb;color:#6355b9;border-radius:9px;padding:4px 8px;margin-left:8px;font-size:12px}.schedule ul{list-style:none;padding:23px 0 0;margin:0}.schedule li{font-size:12px;line-height:1.9}.schedule li b{color:#7565e9;margin-right:7px}.schedule li:last-child b{color:#ef7674}
    .metric-card{min-height:110px;position:relative;overflow:hidden}.metric-card h3{font-size:17px;margin-bottom:7px}.metric-card .big{font-size:23px;font-weight:780}.metric-card .sub{font-size:12px;color:var(--muted);margin-top:5px}.icon-label{display:flex;gap:8px;align-items:center;color:#4a3d8d;font-size:13px;font-weight:650;margin-bottom:5px}.orb{position:absolute;right:18px;top:16px;width:82px;height:82px;border-radius:50%;background:radial-gradient(circle,#faf8ff 10%,#eee8ff 48%,rgba(244,239,255,.15) 70%);display:grid;place-items:center;color:#6352c9;text-align:center;font-size:12px}.orb strong{display:block;font-size:25px}.arc{position:absolute;right:18px;bottom:16px;width:92px;height:50px;border:7px double #d9ceff;border-bottom:0;border-radius:100px 100px 0 0;opacity:.85}
    .steps{font-size:15px;line-height:1.8}.steps b{font-size:16px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;background:#d9c467}.dot.p{background:#b894f1}
    .bottom-nav{position:absolute;z-index:20;left:0;right:0;bottom:0;height:76px;padding:9px 38px calc(8px + env(safe-area-inset-bottom));background:rgba(232,250,247,.95);backdrop-filter:blur(12px);display:flex;justify-content:space-between;border-top:1px solid rgba(210,232,230,.8)}
    .nav-btn{border:0;background:transparent;color:#91a6a6;display:flex;min-width:62px;flex-direction:column;align-items:center;gap:4px;font-size:11px;cursor:pointer}.nav-btn .nav-icon{width:34px;height:28px;border-radius:18px;display:grid;place-items:center;font-size:18px}.nav-btn.active{color:#35c8bd;font-weight:700}.nav-btn.active .nav-icon{background:#ddfaf6}
    .seg{display:flex;background:#efeafb;border-radius:20px;padding:2px;margin-bottom:18px}.seg button{border:0;background:transparent;border-radius:18px;height:38px;flex:1;color:#6754c6;font-size:13px;cursor:pointer}.seg button.on{color:#fff;background:linear-gradient(90deg,var(--purple),var(--blue));font-weight:700}
    .gauge{width:155px;height:82px;margin:0 auto 8px;position:relative;overflow:hidden}.gauge:before{content:"";position:absolute;inset:0;border:14px solid transparent;border-top-color:#5589e7;border-left-color:#61dd94;border-right-color:#ffcb3f;border-radius:50%}.gauge:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;bottom:0;left:2px;background:#fff;box-shadow:0 0 4px #74dc9b}.gauge-text{text-align:center;margin-top:-22px;margin-bottom:25px}.gauge-text b{font-size:22px}.gauge-text span{display:block;color:var(--muted);font-size:12px}
    .health-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.health-box{min-height:126px;border:1.5px solid #acbdf8;border-radius:14px;padding:14px;background:rgba(255,255,255,.18);cursor:pointer}.health-box h3{font-size:16px}.health-box .empty{height:70px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px}.health-value{font-size:27px;font-weight:800;margin:18px 0 2px}.health-value small{font-size:11px;color:var(--muted);font-weight:500}.gradient-btn{width:100%;height:42px;border:0;border-radius:12px;color:#fff;font-weight:700;background:linear-gradient(90deg,#8e79ef,#4f92f6);margin-top:12px;cursor:pointer}.gradient-btn:active{filter:brightness(.96)}
    .history-card{padding:15px 15px 12px}.history-card h3{font-size:15px}.history-value{text-align:center;font-size:31px;font-weight:800;margin:16px 0 8px}.history-value small{font-size:12px;color:#7b8795;font-weight:500}.chart{height:86px;width:100%;display:block}.chart line{stroke:#ded7ff;stroke-width:2}.chart polyline{fill:none;stroke:#7f68ec;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart circle{fill:#fff;stroke:#7f68ec;stroke-width:3}.range-tabs{display:flex;justify-content:space-around;margin-bottom:12px}.range-tabs button{border:0;background:transparent;color:#5d6980;padding:7px 24px;border-bottom:2px solid transparent;cursor:pointer}.range-tabs button.on{color:#6f5de4;border-color:#6f5de4;font-weight:700}.date-nav{text-align:center;color:#4e5c70;font-size:13px;margin-bottom:12px}.date-nav b{margin:0 22px}
    .profile-card{text-align:center;padding:16px 16px 10px}.profile-top{text-align:left;font-weight:700;cursor:pointer}.avatar{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--mint-soft);color:var(--mint);margin-right:7px}.ring{width:140px;height:auto;display:block;margin:8px auto 0;mix-blend-mode:multiply}.device-name{font-size:13px}.connect{display:inline-block;margin:7px 0 2px;background:#ecfbfa;color:#57d5cc;border-radius:18px;padding:5px 13px;font-size:12px}.help{color:#48cfc6;font-size:12px}
    .menu{background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}.menu-row{height:48px;border:0;border-bottom:1px solid var(--line);width:100%;background:#fff;display:flex;align-items:center;padding:0 14px;cursor:pointer;text-align:left}.menu-row:last-child{border-bottom:0}.menu-row .mi{width:26px;color:#655ad4}.menu-row small{display:block;color:#a2acb6;font-size:10px;margin-top:2px}.menu-row .chev{margin-left:auto;color:#9ca9b0;font-size:18px}
    .form-card{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:14px}.form-row{display:flex;min-height:49px;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);font-size:14px}.form-row:last-child{border-bottom:0}.form-row span:last-child,.form-row input{margin-left:auto;color:#8b98a8}.form-row input{border:0;text-align:right;width:62%;outline:none;background:transparent}.note{font-size:11px;color:#8a969f;line-height:1.7;padding:10px}.danger-btn{width:100%;height:42px;border:1px solid #f1d2ca;background:#fff8f4;color:#ea786a;border-radius:20px;margin-top:8px}
    .report-status{border:1px solid #bfd9d8;background:rgba(255,255,255,.45)}.report-status .row{display:flex;justify-content:space-between;align-items:center}.report-status b{font-size:17px}.report-status em{font-style:normal;color:#48d0c4}.mint-btn{width:100%;border:0;background:#50d0c8;color:#fff;height:40px;border-radius:10px;margin-top:14px;font-weight:700}.report-entry p{font-size:13px;color:#71808f;line-height:1.9}.link{color:#7763ed;font-size:13px}.report-head{font-size:19px;font-weight:750;margin:14px 0 10px;border-left:4px solid #278fe8;padding-left:9px}.summary{background:#eef6ff;color:#2b73bf;padding:10px;border-radius:4px;font-size:13px}.bullets{padding-left:20px;color:#4b5662;font-size:13px;line-height:1.75}.constitution{color:#35bd3e;font-size:21px;font-weight:750}.soft-box{background:#f5f7fb;border-radius:7px;padding:13px;margin-top:10px;font-size:12px;line-height:1.75;color:#596778}.risk{background:#275ba1;color:#fff;border-radius:7px;text-align:center;padding:14px;margin-bottom:10px;font-size:18px;box-shadow:0 4px 9px rgba(21,69,135,.22)}
    .vitals{display:flex;justify-content:center;gap:20px;margin:28px 0 12px}.vital{width:62px;height:70px;color:#fff;border-radius:5px;display:grid;place-items:center;text-align:center;background:#4c85db}.vital.red{background:#df4653}.vital b{font-size:24px}.bar{height:8px;border-radius:5px;background:linear-gradient(90deg,#f2c341 0 32%,#5c8fd0 32% 66%,#d94855 66%);position:relative;margin:20px 5px}.bar i{position:absolute;left:47%;top:-5px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #5c8fd0}.section-title{text-align:center;font-weight:750;margin:28px 0 12px}.risk-row{height:45px;border-bottom:1px solid var(--line);display:flex;align-items:center}.risk-row .badge{margin-left:auto;border:1px solid #efc0a8;color:#e6966d;border-radius:12px;padding:3px 8px;font-size:11px}
    .about-content{background:#fff;border-radius:7px;padding:10px 12px}.about .topline{position:sticky;top:-12px;background:var(--bg);z-index:5;padding:10px 0}.about li{margin-bottom:12px}.report-detail .topline{position:sticky;top:-12px;background:var(--bg);z-index:5;padding:10px 0}.report-detail .topline h1{font-size:16px}
    .about h2{font-size:16px;color:#3bbeb7;margin:4px 0 12px}.about h3{font-size:14px;margin:14px 0 6px}.about p,.about li{font-size:12px;line-height:1.75;color:#596778}.about ol{padding-left:20px}
    .modal{position:absolute;inset:0;z-index:50;background:rgba(14,25,29,.38);display:grid;place-items:center;padding:28px}.dialog{width:100%;max-width:390px;background:#f4ffff;border-radius:16px;padding:22px}.dialog h2{font-size:19px;margin-bottom:12px}.dialog p{font-size:12px;line-height:1.8;color:#66737f}.dialog-actions{display:flex;justify-content:flex-end;gap:18px;margin-top:18px}.dialog-actions button{border:0;background:transparent;color:#37bfb6;font-weight:700}.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;background:rgba(20,33,42,.85);color:#fff;border-radius:20px;padding:9px 16px;font-size:12px;white-space:nowrap;animation:toast 2s both}@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
    @media (min-width:540px){body{display:grid;place-items:center;min-height:100vh}.shell{height:min(900px,96vh);border-radius:25px;border:8px solid #25333b}.screen{height:calc(min(900px,96vh) - 40px)}}
  </style>
</head>

    const history=()=>`<section class="screen detail">${top('历史趋势')}<div class="range-tabs"><button class="${state.historyRange==='day'?'on':''}" data-action="range" data-range="day">日</button><button class="${state.historyRange==='week'?'on':''}" data-action="range" data-range="week">周</button><button class="${state.historyRange==='month'?'on':''}" data-action="range" data-range="month">月</button></div><div class="date-nav">‹ <b>${state.historyRange==='day'?'2026年09月09日，星期三':state.historyRange==='week'?'2026/09/07 - 2026/09/13':'2026年9月'}</b> ›</div>

    function historyCard(title,value,unit,points){const coords=points.map((y,i)=>`${i*48+4},${82-y}`).join(' ');return `<article class="card history-card"><h3>${title}</h3><div class="history-value">${value}<small> ${unit}</small></div><svg class="chart" viewBox="0 0 390 86" preserveAspectRatio="none"><line x1="0" y1="72" x2="390" y2="72"></line><polyline points="${coords}"></polyline><circle cx="${state.historyRange==='day'?196:100}" cy="${state.historyRange==='day'?45:50}" r="5"></circle></svg></article>`}
    const reports=()=>`<section class="screen detail">${top('养生健康报告')}<article class="card report-status"><div class="row"><b>报告状态</b><em>2份</em></div><p style="font-size:14px;margin-top:10px">气虚体质</p><p class="date">报告时间：2026年9月8日 16:37:55</p><button class="mint-btn" data-action="toast">刷新历史记录</button></article><article class="card report-entry clickable" data-action="open" data-screen="report"><b>体质：气虚体质</b><p>报告时间：2026-09-08T16:37:55+08:00</p><span class="link">点击历史记录看详情</span></article><article class="card report-entry clickable" data-action="open" data-screen="report"><b>体质：气虚体质</b><p>报告时间：2026-09-08T16:37:18+08:00</p><span class="link">点击历史记录看详情</span></article></section>`;
    const report=()=>`<section class="screen detail report-detail">${top('健康分析报告')}<article class="card"><div class="form-row"><b>姓名</b><span>王琳琳</span></div><div class="form-row"><b>性别</b><span>女</span></div><div class="form-row"><b>年龄</b><span>29岁</span></div><div class="form-row"><b>手机</b><span>158****7130</span></div><div class="form-row"><b>身高 / 体重</b><span>162cm / 52kg</span></div><div class="form-row"><b>BMI</b><span>19.8　<span style="color:#44c933">正常</span></span></div></article>
      <article class="card"><h2 class="report-head">综合摘要</h2><div class="summary"><b>核心结论：</b>本次检测提示您以气虚体质为主</div><h3 style="font-size:14px;margin-top:12px">首要调理建议：</h3><ul class="bullets"><li>每日保持充足睡眠，避免熬夜。</li><li>适当增加蔬菜摄入，减少油腻食物。</li><li>进行适度的有氧运动，如散步或慢跑。</li></ul></article>
      <article class="card"><h2 class="report-head">气虚体质</h2><div class="constitution">● 脾气虚弱</div><h3 style="font-size:15px;margin:12px 0 6px">成因分析</h3><p style="font-size:13px;line-height:1.75;color:#586576">长期饮食不规律及情绪压力大导致脾胃虚弱、肌气耐压、运动引发身体短暂功能失衡。</p><div class="soft-box"><b>体质风险</b><br>整体基本平稳，但仍有若干日常关注点。建议保持规律作息、适度运动与清淡饮食。</div></article>
      <div class="risk">心气不足<br><small>点击可查看详情</small></div><div class="risk">肺气不足<br><small>点击可查看详情</small></div><h2 class="section-title">心率&血氧</h2><div class="vitals"><div class="vital"><b>68</b><small>心率（次/分）</small></div><div class="vital red"><b>98</b><small>血氧（%）</small></div></div><div class="bar"><i></i></div>${historyCard('脉象趋势','68','次/分',[20,66,36,45,30,67,40,32,68])}<h2 class="section-title">疾病风险（预估）</h2><div class="card"><div class="risk-row">🔵 脑梗<span class="badge">中风险</span></div><div class="risk-row">🟠 心梗<span class="badge">中风险</span></div><div class="risk-row">🔴 血压<span class="badge">中风险</span></div></div></section>`;
    const basic=()=>`<section class="screen detail">${top('基本信息')}<div class="form-card"><div class="form-row"><span class="avatar">♙</span><span>修改头像 ›</span></div></div><div class="form-card"><div class="form-row"><b>昵称</b><span>王琳琳 ›</span></div><div class="form-row"><b>生日</b><span>未设置 ›</span></div><div class="form-row"><b>性别</b><span>女 ›</span></div><div class="form-row"><b>身高</b><span>162厘米 ›</span></div><div class="form-row"><b>体重</b><span>52公斤 ›</span></div></div><p class="note">注：您提供的性别、身高、体重、出生日期信息，仅用于健康数据测算。本页面为交互原型，数据均为演示数据。</p><button class="danger-btn" data-action="toast">退出账号</button></section>`;
    const settings=()=>`<section class="screen detail">${top('通用设置')}<div class="menu"><button class="menu-row" data-action="toast"><span class="mi">◈</span><span>账号与商户<small>已绑定 中国大陆</small></span><span class="chev">›</span></button><button class="menu-row" data-action="toast"><span class="mi">♥</span><span>后台自动采集<small>已关闭，可点击切换开关</small></span><span class="chev">›</span></button><button class="menu-row" data-action="toast"><span class="mi">◎</span><span>语言<small>中文（简体）</small></span><span class="chev">›</span></button><button class="menu-row" data-action="toast"><span class="mi">◈</span><span>权限管理<small>已开启 3/3 项关键权限</small></span><span class="chev">›</span></button></div></section>`;
    const device=()=>`<section class="screen detail">${top('添加戒指')}<article class="card" style="text-align:center;padding:28px"><div style="width:72px;height:72px;border-radius:50%;margin:auto;background:#eeeaff;display:grid;place-items:center;font-size:30px;color:#6756d9">⌁</div><button class="gradient-btn" data-action="connect">正在连接岐伯 Ring</button></article><article class="card"><b>岐伯 Ring</b><span style="float:right;color:#4f92f6">▥</span><p class="date" style="margin-top:8px">41:A0:DF:E8:CA</p><span class="connect">戒指设备</span></article></section>`;
    const calibration=()=>`<section class="screen detail">${top('健康数据校准')}<p class="note">填写近期测量值，用于辅助校准健康趋势。本原型不会保存数据。</p><div class="form-card">${['餐前血糖（mmol/L）','餐后血糖（mmol/L）','收缩压（mmHg）','舒张压（mmHg）','尿酸（μmol/L）','血氧（%）'].map(x=>`<label class="form-row"><b>${x}</b><input placeholder="请输入数值"></label>`).join('')}</div><button class="gradient-btn" data-action="toast">保存校准数据</button></section>`;
    const about=()=>`<section class="screen about">${top('关于我们')}<article class="about-content"><h2>关于岐伯 Ring</h2><p>岐伯 Ring 是面向日常健康管理打造的智能穿戴产品，由海河岐伯团队联合元气慧康共同打造。产品以智能戒指作为连续健康数据入口，通过对日常身体状态的持续感知和分析，帮助用户更直观地了解自身健康变化，并获得个性化健康管理建议。</p><h3>技术与能力</h3><p>岐伯 Ring 依托“海河·岐伯”中医药大模型的智能分析能力，并结合元气慧康在智能穿戴与连续健康数据采集方面的产品能力，为体质分析、健康趋势解读和个性化健康建议提供技术支持。</p><h3>产品理念</h3><p>让健康管理从一次检测走向持续感知与长期陪伴。岐伯 Ring 致力于通过智能穿戴与 AI 技术，为用户提供便捷、持续的日常健康管理服务。</p><p class="date">本产品提供的健康数据、分析结果及相关建议仅用于日常健康管理参考，不作为疾病诊断或治疗依据。</p></article></section>${nav('profile')}`;
    const renderers={home,health,profile,history,reports,report,basic,settings,device,calibration,about};
    function render(){app.innerHTML=status()+renderers[state.screen]()+ (state.modal?`<div class="modal"><div class="dialog"><h2>发现新版本</h2><p>当前版本：1.0.53（53）<br>最新版本：1.0.56（56）<br><br>优化设备连接体验，修复已知问题。</p><div class="dialog-actions"><button data-action="close-modal">稍后再说</button><button data-action="close-modal">立即更新</button></div></div></div>`:'');}
    function openScreen(screen){state.stack.push(state.screen);state.screen=screen;render();}
    function toast(message='操作已记录（原型演示）'){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=message;document.getElementById('shell').appendChild(el);setTimeout(()=>el.remove(),2100)}
    app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
      if(a==='nav'){state.stack=[];state.screen=b.dataset.screen;render()}
      else if(a==='open')openScreen(b.dataset.screen);
      else if(a==='back'){state.screen=state.stack.pop()||'home';render()}
      else if(a==='history')openScreen('history');
      else if(a==='reports')openScreen('reports');
      else if(a==='health-mode'){state.healthMode=b.dataset.mode;render()}
      else if(a==='range'){state.historyRange=b.dataset.range;render()}
      else if(a==='measure'){state.measured=true;render();toast('检测完成：当前状态正常')}
      else if(a==='version'){state.modal=true;render()}
      else if(a==='close-modal'){state.modal=false;render()}
      else if(a==='connect')toast('正在搜索附近的戒指…');
      else if(a==='toast')toast();
    });
    render();
    })();
  </script>
